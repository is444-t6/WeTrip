<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE15A"/>
      <stop offset="1" stop-color="#FF9A1F"/>
    </linearGradient>
    <linearGradient id="pinP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7B4DFF"/>
      <stop offset="1" stop-color="#4A1FB8"/>
    </linearGradient>
    <linearGradient id="pinW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9E2FF"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1E0B5C" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#3A1696" flood-opacity="0.35"/>
    </filter>
    <clipPath id="tileClip"><rect x="60" y="50" width="480" height="480" rx="120"/></clipPath>
  </defs>

  <!-- app tile -->
  <g filter="url(#drop)">
    <rect x="60" y="50" width="480" height="480" rx="120" fill="url(#tile)"/>
  </g>
  <g clip-path="url(#tileClip)">
    <ellipse cx="240" cy="90" rx="300" ry="120" fill="url(#gloss)"/>
  </g>

  <!-- dashed flight path looping around the pins -->
  <path d="M120 430 C 150 520, 330 500, 420 400 S 520 200, 455 150"
        fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 26" opacity="0.95"/>
  <!-- paper plane at end of path -->
  <g transform="translate(452 140) rotate(-35)">
    <path d="M-34 6 L38 -22 L10 30 L2 10 Z" fill="#FFFFFF"/>
    <path d="M2 10 L38 -22 L-2 4 Z" fill="#D9CCFF"/>
  </g>

  <!-- back pin (white) -->
  <g filter="url(#soft)" transform="translate(338 250)">
    <path d="M0 -112 C 62 -112 104 -66 104 -6 C 104 64 30 120 0 170 C -30 120 -104 64 -104 -6 C -104 -66 -62 -112 0 -112 Z" fill="url(#pinW)"/>
    <circle cx="0" cy="-8" r="40" fill="#FFB22E"/>
  </g>

  <!-- front pin (purple) -->
  <g filter="url(#soft)" transform="translate(238 270)">
    <path d="M0 -122 C 68 -122 114 -72 114 -6 C 114 70 33 132 0 186 C -33 132 -114 70 -114 -6 C -114 -72 -68 -122 0 -122 Z" fill="url(#pinP)"/>
    <!-- coin in the pin -->
    <circle cx="0" cy="-8" r="52" fill="#FFD84A"/>
    <circle cx="0" cy="-8" r="40" fill="none" stroke="#F2A20F" stroke-width="6"/>
    <text x="0" y="12" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, Helvetica, sans-serif" font-weight="800" font-size="56" fill="#B86A00">W</text>
    <!-- gloss -->
    <path d="M-80 -60 C -60 -100 -20 -112 20 -110" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
