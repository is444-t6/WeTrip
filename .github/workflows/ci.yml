name: CI

on:
  push:
    branches: [main]
    # Docs and diagrams cannot change the bundle or an API contract, so a
    # docs-only push does not need build/lint or the live-sandbox E2E suite.
    # CD follows CI, so it is skipped for these commits too.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build

  e2e:
    # Fork PRs get no secrets, so the live-API suite cannot run there.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/e2e-tests.yml
    secrets:
      WETRIP_SERVER_KEY: ${{ secrets.WETRIP_SERVER_KEY }}
