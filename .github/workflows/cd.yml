name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production
      cancel-in-progress: false
      queue: max
    env:
      VERCEL_ORG_ID: team_qxSt8IYPnfIh6WNbpzI2nMBq
      VERCEL_PROJECT_ID: prj_jzBF2zUnIDyhXQzrz87o239c9IaQ
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile

      - run: bunx vercel@63.1.2 pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: bunx vercel@63.1.2 build --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # A newer push may already be on main; deploying an older SHA would roll
      # production back. Docs-only commits are the exception: CI is skipped for
      # them, so allow this deploy to proceed when only *.md or docs/** moved.
      - run: |
          tested="${{ github.event.workflow_run.head_sha }}"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$tested" ]; then
            exit 0
          fi
          changed="$(git diff --name-only "$tested" origin/main)"
          if grep -vE '^(docs/|.*\.md$)' <<< "$changed" | grep -q .; then
            echo "main moved past $tested with non-doc changes; refusing to deploy"
            exit 1
          fi
          echo "only docs changed since $tested; deploying the tested code"

      - run: bunx vercel@63.1.2 deploy --prebuilt --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
